azure:
  user_or_org: phenix-release
  project_name: feedstock-builds
  settings_win:
    variables:
      CONDA_BLD_PATH: C:\\bld\\
build_platform:
  osx_arm64: osx_64
conda_build:
  pkg_format: '2'
  zstd_compression_level: 16
github:
  user_or_org: phenix-project
  repo_name: phenix-feedstock
  branch_name: main
  tooling_branch_name: main
secrets:
  - TARBALL_PASSWORD
provider:
  linux_64: azure
  osx_64: azure
  win_64: azure
  test: native
upload_on_branch: upload
workflow_settings:
  free_disk_space: max
  store_build_artifacts:
  - platform:
    - linux_64
    - osx_64
    - osx_arm64
    - win_64
    value: true
